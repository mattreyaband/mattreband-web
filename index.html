<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mattreya — Coming Soon</title>
  <meta name="description" content="Sitio oficial de Mattreya. Próximamente." />
  <style>
    :root {
      --bg: #050505;
      --text: #f4e9e9;
      --muted: #9b8b8b;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 30%, rgba(140, 10, 10, 0.30), transparent 30%),
        linear-gradient(180deg, #0a0a0a 0%, #050505 45%, #020202 100%);
      color: var(--text);
    }
    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 72px 72px;
      opacity: .18;
      mask-image: radial-gradient(circle at center, black 35%, transparent 85%);
      pointer-events: none;
    }
    .ring, .ring2 {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(161,18,18,.18);
      border-radius: 999px;
      pointer-events: none;
    }
    .ring { width: 34rem; height: 34rem; }
    .ring2 { width: 25rem; height: 25rem; }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      position: relative;
      z-index: 1;
    }
    .card {
      width: min(100%, 920px);
      text-align: center;
      padding: 20px;
    }
    .logo {
      width: min(100%, 680px);
      max-height: 46vh;
      object-fit: contain;
      display: block;
      margin: 0 auto 18px;
      filter: drop-shadow(0 0 36px rgba(161,18,18,.18));
    }
    .eyebrow {
      margin: 0 0 14px;
      letter-spacing: .45em;
      text-transform: uppercase;
      font-size: 11px;
      color: #d97575;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 88px);
      letter-spacing: .18em;
      font-weight: 700;
      line-height: .95;
    }
    .sub {
      margin: 18px auto 0;
      max-width: 560px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="ring"></div>
  <div class="ring2"></div>

  <main class="wrap">
    <section class="card">
      <img class="logo" src="logo.jpg" alt="Logo Mattreya" />
      <p class="eyebrow">Sitio oficial</p>
      <h1>COMING SOON</h1>
      <p class="sub">Mattreya está preparando su lanzamiento oficial.</p>
    </section>
  </main>
</body>
</html>
